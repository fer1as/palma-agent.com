<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Esfera 3D Distorsionada</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #08090C; /* Fondo que empasta con la landing */
        }
        canvas {
            display: block;
        }
    </style>
</head>
<body>

    <!-- Importamos Three.js desde un CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <!-- Importamos OrbitControls para poder rotar la esfera con el ratón -->
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>

    <script>
        // 1. CONFIGURACIÓN BÁSICA (Escena, Cámara, Renderizador)
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.z = 5;

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setClearColor(0x08090C); /* fondo que empasta con la landing */
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);

        const controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;

        // 2. CREAR LA ESFERA DE PUNTOS
        const numPoints = 3000; // Cantidad de puntos en la esfera
        const radius = 2; // Radio de la esfera
        const geometry = new THREE.BufferGeometry();
        const positions = new Float32Array(numPoints * 3);
        const originalPositions = new Float32Array(numPoints * 3); // Guardamos la posición original para poder distorsionarla

        // Distribuimos los puntos de manera uniforme sobre la superficie de una esfera
        for (let i = 0; i < numPoints; i++) {
            const theta = Math.random() * Math.PI * 2;
            const phi = Math.acos((Math.random() * 2) - 1);
            
            const x = radius * Math.sin(phi) * Math.cos(theta);
            const y = radius * Math.sin(phi) * Math.sin(theta);
            const z = radius * Math.cos(phi);

            positions[i * 3] = x;
            positions[i * 3 + 1] = y;
            positions[i * 3 + 2] = z;

            originalPositions[i * 3] = x;
            originalPositions[i * 3 + 1] = y;
            originalPositions[i * 3 + 2] = z;
        }

        geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));

        // Material de los puntos (blanco y un poco brillante)
        const material = new THREE.PointsMaterial({
            color: 0x3399aa,
            size: 0.025,
            sizeAttenuation: true
        });

        const sphere = new THREE.Points(geometry, material);
        scene.add(sphere);

        // 3. LÓGICA DE DISTORSIÓN (Las barras invisibles)
        const clock = new THREE.Clock();
        const numBars = 5; // Número de barras invisibles
        const barSpeed = 0.5; // Velocidad de izquierda a derecha

        function animate() {
            requestAnimationFrame(animate);
            
            const time = clock.getElapsedTime();
            const posArray = sphere.geometry.attributes.position.array;

            for (let i = 0; i < numPoints; i++) {
                // Posición original del punto
                let ox = originalPositions[i * 3];
                let oy = originalPositions[i * 3 + 1];
                let oz = originalPositions[i * 3 + 2];

                // Vector normal (para saber hacia dónde empujar el punto)
                let nx = ox / radius;
                let ny = oy / radius;
                let nz = oz / radius;

                let totalDisplacement = 0;

                // Calculamos la distorsión causada por cada barra
                for (let b = 0; b < numBars; b++) {
                    // Movimiento de la barra de izquierda a derecha (usando Seno para que vaya y vuelva suavemente)
                    let barX = Math.sin(time * barSpeed + b * (Math.PI * 15 / numBars)) * radius * 1.0;
                    
                    // Distancia del punto a la barra invisible en el eje X
                    let dist = Math.abs(ox - barX);
                    
                    // Si el punto está cerca de la barra, lo empujamos (usamos una curva gaussiana para que el efecto sea suave y localizado)
                    let influence = Math.exp(-dist * dist * 15); 
                    totalDisplacement += influence * 0.2; // 0.8 es la fuerza de empuje
                }

                // Aplicamos la distorsión a la posición real del punto
                posArray[i * 3]     = ox + nx * totalDisplacement;
                posArray[i * 3 + 1] = oy + ny * totalDisplacement;
                posArray[i * 3 + 2] = oz + nz * totalDisplacement;
            }

            // Le decimos a Three.js que actualice los puntos en la pantalla
            sphere.geometry.attributes.position.needsUpdate = true;
            
            // Rotación lenta automática para que se vea bonito
            sphere.rotation.y += 0.001;

            controls.update();
            renderer.render(scene, camera);
        }

        // 4. ADAPTAR A PANTALLA
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        // Iniciar animación
        animate();
    </script>
</body>
</html>
